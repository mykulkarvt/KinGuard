<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinGuard — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small style="opacity:.85">Log in</small></span></span></header>
  <div class="stage">
    <div id="deleted" style="display:none;background:var(--teal-soft);border:2px solid #BFE0D6;border-radius:16px;
      padding:14px 16px;margin-bottom:16px;font-weight:700;color:#0A4E43">
      ✅ Your account has been deleted.</div>
    <div class="lead" style="margin-bottom:14px">Family log in</div>
    <form class="authform" onsubmit="return doLogin(event)">
      <label class="fld">Email
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com"></label>
      <label class="fld">Password
        <input id="pw" type="password" autocomplete="current-password" placeholder="Your password"></label>
      <div style="text-align:right;margin-top:-8px">
        <a href="/forgot-password" style="color:var(--muted);font-weight:700;font-size:13px">Forgot password?</a></div>
      <button class="listen" style="margin-top:8px" type="submit">Log in</button>
    </form>
    <div id="msg"></div>
    <div style="text-align:center;margin-top:18px;font-weight:600;color:var(--muted)">
      New to KinGuard? <a href="/register" style="color:#0A4E43;font-weight:800">Create an account</a></div>
  </div>
  <div class="footnote">Only a family member logs in — the senior never needs to.<br>
    <a href="/how-it-works" style="color:#0A4E43;font-weight:700">How KinGuard works</a></div>
</div>
<script>
function nextUrl(){ const n=new URLSearchParams(location.search).get('next'); return (n && n.startsWith('/') && !n.startsWith('//')) ? n : '/family'; }
// Shown once after a successful account deletion (see /api/account).
if(new URLSearchParams(location.search).get('deleted')==='1'){
  document.getElementById('deleted').style.display='block';
}
function err(t){ document.getElementById('msg').innerHTML='<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">'+t+'</div>'; }
async function doLogin(e){
  if(e) e.preventDefault();
  const email=(document.getElementById('email').value||'').trim();
  const password=document.getElementById('pw').value||'';
  document.getElementById('msg').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ location.href=nextUrl(); return; }
    err(j.error||'Could not log in.');
  }catch(e){ err('Network error — please try again.'); }
  return false;
}
</script>
</body>
</html>
