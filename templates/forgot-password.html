<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinGuard — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small style="opacity:.85">Reset password</small></span></span></header>
  <div class="stage">
    <div class="lead" style="margin-bottom:14px">Reset your password</div>
    <div id="pre" style="font-weight:600;color:var(--muted);margin-bottom:14px">
      Enter the email on your account. If it's registered, we'll send a link to reset your password.</div>
    <form class="authform" id="reqForm" onsubmit="return doRequest(event)">
      <label class="fld">Email
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com"></label>
      <button class="listen" style="margin-top:8px" type="submit">Send reset link</button>
    </form>
    <div id="sent" style="display:none;background:var(--teal-soft);border:2px solid #BFE0D6;border-radius:16px;
      padding:14px 16px;margin-top:14px;font-weight:700;color:#0A4E43">
      ✅ If that email is registered, a reset link is on its way. It expires in 30 minutes.</div>
    <div id="msg"></div>
    <div style="text-align:center;margin-top:18px;font-weight:600;color:var(--muted)">
      <a href="/login" style="color:#0A4E43;font-weight:800">Back to log in</a></div>
  </div>
  <div class="footnote">Only a family member logs in — the senior never needs to.</div>
</div>
<script>
function err(t){ document.getElementById('msg').innerHTML='<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">'+t+'</div>'; }
async function doRequest(e){
  if(e) e.preventDefault();
  const email=(document.getElementById('email').value||'').trim();
  document.getElementById('msg').textContent='';
  try{
    const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    if(r.ok){
      document.getElementById('reqForm').style.display='none';
      document.getElementById('pre').style.display='none';
      document.getElementById('sent').style.display='block';
      return false;
    }
    const j=await r.json().catch(()=>({}));
    err(j.error||'Something went wrong.');
  }catch(e){ err('Network error — please try again.'); }
  return false;
}
</script>
</body>
</html>
