<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinGuard — Create account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small style="opacity:.85">Create account</small></span></span></header>
  <div class="stage">
    <div class="lead" style="margin-bottom:14px">Create a family account</div>
    <form class="authform" onsubmit="return doRegister(event)">
      <label class="fld">Email
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com"></label>
      <label class="fld">Password
        <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label>
      <button class="listen" style="margin-top:8px" type="submit">Create account</button>
    </form>
    <div id="msg"></div>
    <div style="text-align:center;margin-top:18px;font-weight:600;color:var(--muted)">
      Already have an account? <a href="/login" style="color:#0A4E43;font-weight:800">Log in</a></div>
  </div>
  <div class="footnote">You set up your senior's phone right after this. The senior never logs in.<br>
    <a href="/how-it-works" style="color:#0A4E43;font-weight:700">How KinGuard works</a></div>
</div>
<script>
function err(t){ document.getElementById('msg').innerHTML='<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">'+t+'</div>'; }
async function doRegister(e){
  if(e) e.preventDefault();
  const email=(document.getElementById('email').value||'').trim();
  const password=document.getElementById('pw').value||'';
  document.getElementById('msg').textContent='';
  if(password.length<8){ err('Password must be at least 8 characters.'); return false; }
  try{
    const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ location.href='/setup'; return; }   // go straight to configuring the pair
    err(j.error||'Could not create the account.');
  }catch(e){ err('Network error — please try again.'); }
  return false;
}
</script>
</body>
</html>
