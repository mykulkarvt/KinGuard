<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Default entry point is the one-time family Setup. The role chooser on this
     page is only shown when explicitly requested with /?pick. Run before the
     body paints so there is no flash of the chooser. -->
<script>if(!location.search.includes('pick')){location.replace('/setup');}</script>
<title>KinGuard — Family safety</title>
<meta name="theme-color" content="#0F6B5C">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="chooser">
  <h1>🛡️ KinGuard</h1>
  <div style="font-size:18px;font-weight:700;color:var(--teal);margin-bottom:18px">Family safety</div>
  <p id="lead">Who is this phone for?</p>
  <div id="opts">
    <a class="s" href="#" onclick="pick('senior')">👵 The senior's phone<br><small style="opacity:.85;font-weight:600">बुज़ुर्ग का फ़ोन</small></a>
    <a class="f" href="#" onclick="pick('family')">👨 The family member's phone<br><small style="opacity:.85;font-weight:600">परिवार का फ़ोन</small></a>
    <a href="/setup" style="background:#fff;color:#0A4E43;border:2px solid #0F6B5C">⚙️ Setup (do this first)</a>
  </div>
  <small>Chosen once, then remembered.</small>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
function pick(role){
  try{ localStorage.setItem('role', role); }catch(e){}
  location.href = role === 'senior' ? '/senior' : '/family';
  return false;
}
</script>
</body>
</html>
