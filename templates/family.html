<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="csrf-token" content="{{ csrf }}">
<title>KinGuard — Family phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header class="fam"><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small id="tag" style="opacity:.85">Family</small></span></span><a href="#" onclick="logout();return false" style="margin-left:auto;color:#fff;opacity:.85;font-weight:700;font-size:13px">Log out</a></header>
  <div class="stage" id="stage" role="main"></div>
  <div class="footnote" id="foot">Sample — the family member's phone.</div>
</div>

<script src="/static/rules.js"></script>
<script>
let alertObj=null, aView='lock';
let cfg={senior_name:SENIOR_NAME, senior_phone:'', family_name:FAMILY_NAME, lang:'en'};
// current language's text/rule tables — set in loadCfg() once settings load
let U=UI.en, R=RULES.en;

// This account's pair + CSRF token are loaded from /api/me at boot. CSRF is
// seeded from the page so it's available even before that call returns.
let PAIR='';
let CSRF=(document.querySelector('meta[name="csrf-token"]')||{}).content||'';
function api(path){ return path + (path.indexOf('?')>=0?'&':'?') + 'pair=' + encodeURIComponent(PAIR); }
function logout(){ fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':CSRF}}).finally(()=>{location.href='/login';}); }

// The family member is the one who configures the pair, so an unlinked family
// phone is sent to Setup (which mints the secret token and the senior's link).
function renderNoPair(){
  document.getElementById('stage').innerHTML =
    `<div class="lockwrap"><div class="verdict safe" role="alert"><span class="vic" aria-hidden="true">⚙️</span>
      <span><div class="vt">Finish setup first</div>
      <div class="vw">Set up KinGuard on the Setup page. This phone then becomes your family screen, and you'll get a private link to send to the senior.</div></span></div>
     <button class="listen" style="margin-top:16px" onclick="location.href='/setup'">Go to Setup ›</button></div>`;
}

function fmtTime(ts){const d=new Date(ts*1000);
  return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}

async function loadCfg(){
  try{
    const r=await fetch(api('/api/settings'));
    if(r.status===401){ location.href='/login'; return; }
    cfg={...cfg, ...await r.json()};
  }catch(e){}
  const lang=langOf(cfg);
  U=UI[lang]; R=RULES[lang];
  document.documentElement.lang=lang;
  document.title='KinGuard — '+(cfg.family_name||'')+U.possPhone;
  const tag=document.getElementById('tag'); if(tag) tag.textContent=U.famTag;
  const foot=document.getElementById('foot');
  if(foot) foot.innerHTML=esc(U.footFamily)+' · <a href="/setup?id='+encodeURIComponent(PAIR)+'" style="color:#0F6B5C;font-weight:700">⚙ Edit</a> · <a href="#" onclick="logout();return false" style="color:#0F6B5C;font-weight:700">Log out</a>';
}

// ---- Web Push: let the family be alerted even when this app is closed ----
let histOpen=false, hist=null;   // past-alerts panel: closed until asked for
let pushReady=false;      // this device has already subscribed + granted permission
let pushBackend=false;    // the server supports push (false on hosts that block it)
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }

// iOS exposes Push only inside a Home Screen app — in an ordinary Safari tab
// PushManager is simply absent, so pushSupported() is false and the button
// below renders nothing at all. Without this the family member on an iPhone
// sees no alerts option and no reason why, and concludes the app can't do
// notifications. Detect that one case and explain the fix instead.
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         // iPadOS 13+ reports itself as a Mac; touch points give it away.
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return window.navigator.standalone === true ||
         window.matchMedia('(display-mode: standalone)').matches;
}
// Only nag when installing would actually change the outcome.
function needsIosInstall(){ return isIOS() && !isStandalone() && !pushSupported(); }

// Tell the server which kind of phone this is, and whether KinGuard was opened
// from the Home Screen. Play reports Android installs; iPhone installs are
// otherwise invisible, because iOS fires no install event at all. Reuses the
// detection above rather than sniffing anything new, and sends three fixed
// words — never the user agent string.
function reportDevice(){
  const platform = isIOS() ? 'ios'
                 : (/Android/.test(navigator.userAgent) ? 'android' : 'other');
  fetch('/api/device',{method:'POST',
    headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},
    body:JSON.stringify({platform, standalone:isStandalone()})}).catch(()=>{});
}

function urlB64ToUint8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(s); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}

async function refreshPushState(){
  if(!pushSupported()) return;
  try{
    // Only offer push if the server can actually send it (some hosts block it).
    const info=await (await fetch('/api/vapid')).json();
    pushBackend = !!info.enabled;
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    pushReady = !!sub && Notification.permission==='granted';
  }catch(e){}
}

async function enablePush(){
  const btn=document.getElementById('pushBtn');
  try{
    const info=await (await fetch('/api/vapid')).json();
    if(!info.enabled || !info.public_key){ if(btn) btn.textContent=U.alertsFail; return; }
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ if(btn) btn.textContent=U.alertsBlocked; return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:urlB64ToUint8(info.public_key)});
    }
    await fetch(api('/api/subscribe'),{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},
      body:JSON.stringify(sub)});
    pushReady=true; render();
  }catch(e){ if(btn) btn.textContent=U.alertsFail; }
}

async function poll(){
  try{
    const r=await fetch(api('/api/alerts'));
    if(r.status===401){ location.href='/login'; return; }
    const data=await r.json();
    if(data.alert){
      if(!alertObj || alertObj.id!==data.alert.id){
        alertObj=data.alert; aView='lock'; render();
        if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]); // always buzz the family
      }
    } else if(alertObj && aView!=='resolved'){ alertObj=null; render(); }
  }catch(e){}
}

function render(){
  const s=document.getElementById('stage');
  if(aView==='detail') s.innerHTML=detailHTML();
  else if(aView==='resolved') s.innerHTML=resolvedHTML();
  else s.innerHTML=lockHTML();
  s.classList.remove('fade');void s.offsetWidth;s.classList.add('fade');
}

function lockHTML(){
  const now=fmtTime(Date.now()/1000);
  const senior=esc(cfg.senior_name);
  if(!alertObj){
    return `<div class="lockwrap">
      <div class="clock"><div class="big">${now}</div><div>${U.today}</div></div>
      <div class="calm">${U.calmNoAlert}<br>
        <span style="font-size:14px;font-weight:600">${fmt(U.seniorSafe,{senior})}</span></div>
      <div style="text-align:center;font-size:13.5px;color:var(--muted);font-weight:600">
        ${fmt(U.pressHint,{senior})}</div>
      ${(pushSupported() && pushBackend) ? `<button id="pushBtn" class="listen" style="margin-top:18px" onclick="enablePush()">${pushReady?U.alertsOn:U.enableAlerts}</button>`
        : (needsIosInstall() ? `<div class="ioshint">${esc(U.iosInstall)}</div>` : '')}
      ${histHTML()}
    </div>`;
  }
  return `<div class="lockwrap">
    <div class="clock"><div class="big">${fmtTime(alertObj.created_at)}</div><div>${U.today}</div></div>
    <div class="notif" onclick="open_()" role="alert">
      <div class="row"><span class="tag">${U.important}</span><span class="when">${U.now}</span></div>
      <div class="ttl">${fmt(U.maybeScam,{senior})}</div>
      <div class="hint">${U.tapToOpen}</div>
    </div></div>`;
}
function open_(){aView='detail';render();}

// Past alerts. Loaded only when opened — the family screen polls every three
// seconds and there is no reason to carry history in that loop.
async function toggleHistory(){
  histOpen = !histOpen;
  render();
  if(histOpen && hist===null){
    try{
      const r = await fetch(api('/api/history'));
      hist = r.ok ? await r.json() : {alerts:[],total:0};
    }catch(e){ hist = {alerts:[],total:0}; }
    render();
  }
}

function histHTML(){
  if(!histOpen) return `<button class="histbtn" onclick="toggleHistory()">${U.histShow}</button>`;
  if(hist===null) return `<button class="histbtn" onclick="toggleHistory()">${U.histLoading}</button>`;
  if(!hist.alerts.length)
    return `<button class="histbtn" onclick="toggleHistory()">${U.histHide}</button>
      <div class="histnone">${U.histEmpty}</div>`;
  const rows = hist.alerts.map(a=>{
    const r = R[a.rule] || {};
    const d = new Date(a.created_at*1000);
    const when = d.getDate()+'/'+(d.getMonth()+1)+' '+fmtTime(a.created_at);
    const live = a.status!=='resolved';
    return `<div class="hrow">
      <span class="hic" aria-hidden="true">${r.icon||'⚠️'}</span>
      <span class="htx"><span class="hlbl">${esc((r.label||a.rule)).slice(0,44)}</span>
        <span class="hwhen">${when}</span></span>
      <span class="hst ${live?'live':''}">${live?U.histActive:U.histResolved}</span>
    </div>`;
  }).join('');
  const more = hist.total>hist.alerts.length
    ? `<div class="histnone">${fmt(U.histMore,{n:hist.total})}</div>` : '';
  return `<button class="histbtn" onclick="toggleHistory()">${U.histHide}</button>
    <div class="histwrap">${rows}${more}</div>`;
}

function detailHTML(){
  const r=R[alertObj.rule];
  const senior=esc(cfg.senior_name);
  const seniorPhone = cfg.senior_phone || '0000';
  let coach='';
  r.coach.forEach((c,i)=>{coach+=`<li><span class="b">${i+1}</span><span>${c}</span></li>`;});
  return `<div class="who"><div class="av">${esc((cfg.senior_name || '?')[0])}</div>
      <div><div class="wt">${senior}</div>
      <div class="ws">${U.pressedHelp} · ${fmtTime(alertObj.created_at)}</div></div></div>
    <div class="card"><div class="k">${U.theyReported}</div>
      <div class="reported"><span class="ic" aria-hidden="true">${r.icon}</span><span>${r.label}</span></div>
      <div class="danger">⚠️ ${r.danger}</div></div>
    <a class="callbtn" href="tel:${esc(seniorPhone)}"><span aria-hidden="true">📞</span><span>${fmt(U.callSeniorNow,{senior})}</span></a>
    <div class="coach"><div class="k">${U.whatToSay}</div><ul>${coach}</ul></div>
    <a class="callbtn sec" href="tel:1930"><span aria-hidden="true">☎️</span><span>${U.report1930}</span></a>
    <button class="resolve" onclick="resolve_()">${U.resolve}</button>`;
}

async function resolve_(){
  try{ const r=await fetch(api('/api/resolve'),{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':CSRF},
        body:JSON.stringify({id:alertObj.id})}); if(r.status===401){ location.href='/login'; return; } }catch(e){}
  aView='resolved'; render();
}

function resolvedHTML(){
  const r=R[alertObj.rule];
  const senior=esc(cfg.senior_name);
  return `<div class="resolved"><div class="big">✅</div>
    <div class="rt">${U.resolvedTitle}</div>
    <div class="rw">${fmt(U.resolvedWhy,{senior})}</div>
    <div style="background:#fff;border:2px solid #ECE3D2;border-radius:16px;padding:14px 16px;margin-top:18px;width:100%;text-align:left">
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:5px 0"><span>${U.report}</span><span style="color:var(--muted);font-weight:600">${r.label.slice(0,18)}…</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:5px 0"><span>${U.time}</span><span style="color:var(--muted);font-weight:600">${fmtTime(alertObj.created_at)}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:700;padding:5px 0"><span>${U.result}</span><span style="color:var(--muted);font-weight:600">${U.noMoneySent}</span></div>
    </div>
    <button class="back" onclick="done_()">${U.done}</button></div>`;
}
function done_(){alertObj=null;aView='lock';render();}

(async function(){
  // Who am I, and which pair do I own? (also refreshes the CSRF token)
  try{
    const r=await fetch('/api/me');
    if(r.status===401){ location.href='/login'; return; }
    const me=await r.json();
    CSRF=me.csrf||CSRF;
    if(me.pairs && me.pairs.length){ PAIR=me.pairs[0].pair; }
  }catch(e){}
  // Before the no-pair early return below: someone who has registered but not
  // finished setup is still a family on an iPhone, and is exactly the person
  // most worth counting when the question is whether onboarding is working.
  reportDevice();   // fire-and-forget; never blocks the screen
  if(!PAIR){ renderNoPair(); return; }
  await loadCfg(); await refreshPushState(); render(); poll(); setInterval(poll,3000);
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
</body>
</html>
