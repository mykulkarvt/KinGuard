<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinGuard — Set new password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small style="opacity:.85">Set new password</small></span></span></header>
  <div class="stage">
    <div id="noToken" style="display:none;font-weight:600;color:var(--muted);margin-bottom:14px">
      This link is missing its reset code. Request a new one from the
      <a href="/forgot-password" style="color:#0A4E43;font-weight:800">forgot password</a> page.</div>
    <div id="formWrap">
      <div class="lead" style="margin-bottom:14px">Set a new password</div>
      <form class="authform" id="resetForm" onsubmit="return doReset(event)">
        <label class="fld">New password
          <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters"></label>
        <button class="listen" style="margin-top:8px" type="submit">Set password</button>
      </form>
    </div>
    <div id="done" style="display:none;background:var(--teal-soft);border:2px solid #BFE0D6;border-radius:16px;
      padding:14px 16px;margin-top:14px;font-weight:700;color:#0A4E43">
      ✅ Password updated. <a href="/login" style="color:#0A4E43">Log in</a> with your new password.</div>
    <div id="msg"></div>
  </div>
  <div class="footnote">Only a family member logs in — the senior never needs to.</div>
</div>
<script>
const token = (new URLSearchParams(location.search).get('token')||'').trim();
if(!token){
  document.getElementById('formWrap').style.display='none';
  document.getElementById('noToken').style.display='block';
}
// Keep the token out of the visible address bar and browser history, same
// habit as the senior pairing link - it stays usable in this page's JS.
if(token) history.replaceState(null, '', '/reset-password');
function err(t){ document.getElementById('msg').innerHTML='<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">'+t+'</div>'; }
async function doReset(e){
  if(e) e.preventDefault();
  const pw=document.getElementById('pw').value||'';
  document.getElementById('msg').textContent='';
  try{
    const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){
      document.getElementById('formWrap').style.display='none';
      document.getElementById('done').style.display='block';
      return false;
    }
    err(j.error||'Could not reset password.');
  }catch(e){ err('Network error — please try again.'); }
  return false;
}
</script>
</body>
</html>
