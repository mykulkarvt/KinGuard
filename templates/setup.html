<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="csrf-token" content="{{ csrf }}">
<title>KinGuard — Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small id="tag" style="opacity:.85">Setup</small></span></span><a href="#" onclick="logout();return false" style="margin-left:auto;color:#fff;opacity:.85;font-weight:700;font-size:13px">Log out</a></header>
  <div class="stage" id="stage"></div>
  <div class="footnote" id="foot">A family member does this setup once.</div>
</div>

<script src="/static/rules.js"></script>
<script>
// esc() / UI / LANGS / langOf() all come from rules.js
let conds = new Set();
let cfg = {};
let lang = 'en';
let delOpen = false;   // is the delete-account confirmation showing?
let acctEmail = '';    // shown in the confirmation so you can see which account
// An account created through Google has no password, so the delete
// confirmation asks it to prove itself with Google instead.
let hasPassword = true;
let googleClientId = '';
// If editing an existing pair, its token is in the URL; otherwise this is a new pair.
let pair = (new URLSearchParams(location.search).get('id')||'').replace(/[^A-Za-z0-9_-]/g,'');

async function init(){
  try{ const url = pair ? '/api/settings?pair='+encodeURIComponent(pair) : '/api/settings';
       cfg = await (await fetch(url)).json();
       (cfg.conditions||[]).forEach(c=>{if(c)conds.add(c);});
       lang = langOf(cfg); }catch(e){}
  try{ const me = await (await fetch('/api/me')).json();
       acctEmail = me.email || '';
       hasPassword = me.has_password !== false;
       googleClientId = me.google_client_id || ''; }catch(e){}
  render();
}

function condMeta(U){
  return [
    {id:'hearing', ic:'🦻', t:U.condHearingT, s:U.condHearingS},
    {id:'vision',  ic:'👓', t:U.condVisionT,  s:U.condVisionS},
    {id:'tremor',  ic:'✋', t:U.condTremorT,  s:U.condTremorS},
    {id:'memory',  ic:'🧠', t:U.condMemoryT,  s:U.condMemoryS}
  ];
}

// Pull whatever is currently typed into cfg so a re-render (after toggling a
// need or switching language) doesn't wipe the user's input.
function readInputs(){
  const g=id=>{const el=document.getElementById(id); return el?el.value:undefined;};
  let v;
  if((v=g('sn'))!==undefined) cfg.senior_name=v;
  if((v=g('sp'))!==undefined) cfg.senior_phone=v;
  if((v=g('fn'))!==undefined) cfg.family_name=v;
  if((v=g('fp'))!==undefined) cfg.family_phone=v;
}

function render(){
  const U = UI[lang] || UI.hi;
  document.documentElement.lang = lang;
  document.title = 'KinGuard — ' + U.setupTag;
  const tag=document.getElementById('tag'); if(tag) tag.textContent=U.setupTag;
  const foot=document.getElementById('foot'); if(foot) foot.textContent=U.setupFoot;

  let cards='';
  condMeta(U).forEach(c=>{
    const on = conds.has(c.id);
    cards += `<button class="opt sel-card ${on?'selected':''}" onclick="toggle('${c.id}')" aria-pressed="${on}">
        <span class="ic">${c.ic}</span>
        <span class="lbl">${c.t}<small>${c.s}</small></span>
        <span class="tick">${on?'✓':''}</span></button>`;
  });

  let langs='';
  LANGS.forEach(l=>{
    const on = l.id===lang;
    langs += `<button class="opt sel-card ${on?'selected':''}" onclick="setLang('${l.id}')" aria-pressed="${on}">
        <span class="lbl">${esc(l.name)}</span>
        <span class="tick">${on?'✓':''}</span></button>`;
  });

  document.getElementById('stage').innerHTML = `
    <div class="divider" style="margin:4px 0 14px">${U.langDivider}</div>
    <div class="grid">${langs}</div>

    <div class="lead" style="margin:22px 0 14px">${U.whichPhone}</div>
    <label class="fld">${U.seniorNameLbl}
      <input id="sn" type="text" value="${esc(cfg.senior_name)}" placeholder="${esc(U.seniorNamePh)}"></label>
    <label class="fld">${U.seniorPhoneLbl}
      <input id="sp" type="tel" value="${esc(cfg.senior_phone)}" placeholder="${esc(U.seniorPhonePh)}"></label>
    <label class="fld">${U.familyNameLbl}
      <input id="fn" type="text" value="${esc(cfg.family_name)}" placeholder="${esc(U.familyNamePh)}"></label>
    <label class="fld">${U.familyPhoneLbl}
      <input id="fp" type="tel" value="${esc(cfg.family_phone)}" placeholder="${esc(U.familyPhonePh)}"></label>

    <div class="divider" style="margin:20px 0 14px">${U.needsDivider}</div>
    <div style="font-size:14px;color:#8a8478;font-weight:600;margin-bottom:12px">
      ${U.needsHelp}</div>
    <div class="grid">${cards}</div>

    <button class="listen" style="margin-top:18px" onclick="save()">${U.save}</button>
    <div id="msg"></div>

    <div class="dzone">
      <div class="divider" style="margin:0 0 14px">${U.accountDivider}</div>
      ${delOpen ? deleteHTML(U)
                : `<button class="dbtn" onclick="askDelete()">${U.deleteAccount}</button>`}
    </div>`;
}

// Google Play requires an in-app way to delete the account and its data. The
// password is asked for again because deleting also kills the senior's phone.
function deleteHTML(U){
  const name = (cfg.senior_name||'').trim();
  const warn = name ? fmt(U.deleteWarnSenior, {senior: esc(name)}) : U.deleteWarnElder;
  return `<div class="dconf">
    <div class="dt">${U.deleteSure}</div>
    <div class="dw">⚠️ ${warn}</div>
    <div class="dk">${U.deleteAlso}</div>
    <ul>
      <li>${U.deleteItemLogin}${acctEmail ? ' — '+esc(acctEmail) : ''}</li>
      <li>${U.deleteItemAlerts}</li>
      <li>${U.deleteItemPhones}</li>
    </ul>
    ${hasPassword ? `<label class="fld">${U.deletePwLbl}
      <input id="dpw" type="password" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false"></label>`
      : `<div class="fld" style="border:none;padding:0">${U.deleteGoogleLbl}</div>
         <div id="gdel" class="gwrap" style="margin-top:10px"></div>`}
    <div class="drow">
      <button class="dcancel" onclick="cancelDelete()">${U.deleteCancel}</button>
      ${hasPassword ? `<button class="dgo" onclick="doDelete()">${U.deleteGo}</button>` : ''}
    </div>
    <div class="derr" id="derr"></div>
  </div>`;
}

function toggle(id){ readInputs(); if(conds.has(id))conds.delete(id); else conds.add(id); render(); }
function setLang(id){ readInputs(); lang=id; render(); }

function csrfHeader(){ const m=document.querySelector('meta[name="csrf-token"]'); return m?m.getAttribute('content'):''; }

async function logout(){
  try{ await fetch('/api/logout',{method:'POST',headers:{'X-CSRF-Token':csrfHeader()}}); }catch(e){}
  location.href='/login';
}

// readInputs() first in both, so whatever is half-typed in the form survives
// the re-render that opens or closes the confirmation.
function askDelete(){
  readInputs(); delOpen = true; render();
  const el = document.getElementById('dpw'); if(el) el.focus();
  // A Google-only account confirms by signing in again rather than typing a
  // password, so Google's own button is the confirm button here.
  if(!hasPassword) renderGoogleDeleteButton();
}

// Google's script is fetched only when a passwordless account actually opens
// the delete box, so the ordinary Setup page loads nothing extra.
function renderGoogleDeleteButton(){
  const box = document.getElementById('gdel');
  if(!box || !googleClientId) return;
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.initialize({client_id: googleClientId, callback: onGoogleDeleteCredential});
    google.accounts.id.renderButton(box, {theme:'outline', size:'large', width:260, shape:'pill'});
    return;
  }
  if(document.getElementById('gsi-script')) return;   // already loading
  const s = document.createElement('script');
  s.id = 'gsi-script';
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = renderGoogleDeleteButton;
  document.head.appendChild(s);
}

// Google handed back a fresh token for whoever just signed in. The server
// checks it is the SAME Google account before deleting anything.
function onGoogleDeleteCredential(res){ doDelete(res && res.credential); }
function cancelDelete(){ readInputs(); delOpen = false; render(); }

async function doDelete(googleCredential){
  const pw  = (document.getElementById('dpw')||{}).value || '';
  const err = document.getElementById('derr');
  const go  = document.querySelector('.dgo');
  if(err) err.textContent = '';
  if(go)  go.disabled = true;
  try{
    const r = await fetch('/api/account',{method:'DELETE',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrfHeader()},
      body:JSON.stringify({password:pw, credential:googleCredential||''})});
    if(r.ok){ location.href = '/login?deleted=1'; return; }
    const j = await r.json().catch(()=>({}));
    if(err) err.textContent = j.error || 'Could not delete the account.';
  }catch(e){
    if(err) err.textContent = 'Could not reach the server.';
  }
  if(go) go.disabled = false;
}

// The senior's link now carries a secret device token (not the phone number).
// We can only show it right after it's minted; on later edits it already exists,
// so we offer a "get a new link" (which revokes the old one).
function successHTML(V, token){
  const openBtn = `<button class="listen" style="margin:14px 0;width:100%" onclick="location.href='/family'">${V.openMyScreen} ›</button>`;
  let linkBlock;
  if(token){
    const sLink = location.origin+'/senior?t='+token;
    linkBlock = `<div>${V.sendSeniorLink}<br>
      <a href="${sLink}" style="color:#0A4E43;font-weight:700;word-break:break-all">${sLink}</a></div>`;
  } else {
    linkBlock = `<div>The senior's link is already active on their phone. Lost it, or want a fresh one?
      <button class="listen" style="margin-top:10px;width:100%;background:#8a8478" onclick="regenLink()">Get a new senior link</button></div>`;
  }
  return `<div class="verdict safe" style="margin-top:16px"><span class="vic">✅</span>
    <span><div class="vt" style="font-size:22px">${V.setupDone}</div>
    <div class="vw" id="doneVw">${openBtn}${linkBlock}</div></span></div>`;
}

async function regenLink(){
  try{
    const r = await fetch('/api/senior-link',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfHeader()},body:JSON.stringify({pair:pair})});
    if(r.status===401){ location.href='/login'; return; }
    const j = await r.json().catch(()=>({}));
    if(j.senior_token){
      const sLink = location.origin+'/senior?t='+j.senior_token;
      document.getElementById('doneVw').innerHTML =
        `<button class="listen" style="margin:14px 0;width:100%" onclick="location.href='/family'">Open my screen ›</button>
         <div>Send this new link to the senior — the old link stops working:<br>
         <a href="${sLink}" style="color:#0A4E43;font-weight:700;word-break:break-all">${sLink}</a></div>`;
    }
  }catch(e){}
}

async function save(){
  readInputs();
  const U = UI[lang] || UI.en;
  const body = {
    pair: pair,                       // existing token when editing; '' creates a new one
    senior_name: cfg.senior_name || '',
    senior_phone: cfg.senior_phone || '',
    family_name: cfg.family_name || '',
    family_phone: cfg.family_phone || '',
    conditions: Array.from(conds),
    lang: lang
  };
  try{
    const res = await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfHeader()},body:JSON.stringify(body)});
    if(res.status===401){ location.href='/login'; return; }
    const out = await res.json().catch(()=>({}));
    if(res.status===400){
      document.getElementById('msg').innerHTML = `<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">Senior's phone number is required — it links the two phones.</div>`;
      return;
    }
    if(!res.ok || !out.pair) throw new Error('save failed');
    pair = out.pair;
    const V = UI[lang] || UI.en;
    document.getElementById('msg').innerHTML = successHTML(V, out.senior_token);
  }catch(e){
    document.getElementById('msg').innerHTML = `<div style="color:#C0392B;font-weight:700;margin-top:14px;text-align:center">${U.saveError}</div>`;
  }
}

init();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
</body>
</html>
