<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KinGuard — Senior's phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<meta name="theme-color" content="#0F6B5C">
<meta name="color-scheme" content="light">
<!-- The elder phone gets its own manifest, whose start_url carries this
     device's token; see /senior.webmanifest. crossorigin="use-credentials"
     is required, a manifest is fetched WITHOUT cookies by default, and
     without them the server cannot tell which device is asking. -->
<link rel="manifest" href="/senior.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="phone">
  <header><span class="brand"><span class="sh">🛡️</span><span>KinGuard <small id="tag" style="opacity:.85">Family safety</small></span></span></header>
  <div class="stage" id="stage" role="main"></div>
  <div class="footnote" id="foot">Sample — the elder's phone.</div>
</div>

<script src="/static/rules.js"></script>
<script>
let view='home';
let sendState='ok';   // 'sending' | 'ok' | 'failed' — did the family actually get the alert?
// defaults; overwritten by onboarding settings
let cfg={senior_name:SENIOR_NAME, senior_phone:'', family_name:FAMILY_NAME, family_phone:'',
         big_text:0, high_contrast:0, vibrate:0, auto_speak:0, simple_mode:0,
         lang:'en', country:DEFAULT_COUNTRY};
// current language's text/rule tables, set in init() once settings load
let U=UI.en, R=RULES[DEFAULT_COUNTRY].en, C=COUNTRIES[DEFAULT_COUNTRY];

// This phone is linked by a secret device token kept in an HttpOnly cookie, set
// when the family's private /senior?t=... link was opened. Nothing identifying
// lives in the page or the URL; requests are authenticated by that cookie.
function api(path){ return path; }

// The settings this screen would normally read are gone whenever the phone is
// unlinked, the family may have revoked the link or deleted their account, so
// the last known language and accessibility needs are kept on the phone itself.
// Without this the elder gets default-size English at the moment the app stops
// working, which is exactly the wrong moment to lose their own language.
const PREF_KEY = 'kg_last_prefs';
function rememberPrefs(lang){
  try{ localStorage.setItem(PREF_KEY, JSON.stringify({
    lang: lang, big_text: !!cfg.big_text, high_contrast: !!cfg.high_contrast
  })); }catch(e){}
}
function lastPrefs(){
  try{ return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; }catch(e){ return {}; }
}

// Shown whenever this phone has no working link: never set up, link revoked, or
// the family's account deleted. The wording has to be true in all three cases -
// it must not promise a link that no longer exists, and it is not
// styled 'safe', because a phone that cannot call for help is not a reassuring
// state and must not look like one.
function renderNoPair(){
  const p = lastPrefs();
  const V = UI[p.lang] || UI.en;
  if(p.big_text)      document.body.classList.add('big-text');
  if(p.high_contrast) document.body.classList.add('high-contrast');
  document.documentElement.lang = p.lang || 'en';
  document.getElementById('stage').innerHTML =
    `<div class="verdict" role="alert"><span class="vic" aria-hidden="true">⚠️</span>
      <span><div class="vt">${esc(V.noPairTitle)}</div>
      <div class="vw">${esc(V.noPairBody)}</div></span></div>`;
}

async function init(){
  let linked=false;
  try{
    const res=await fetch('/api/senior');
    if(res.ok){ cfg={...cfg, ...await res.json()}; linked=true; }
  }catch(e){}
  if(!linked){ renderNoPair(); return; }
  const country=countryOf(cfg), lang=langOf(cfg);
  U=UI[lang]; R=RULES[country][lang]; C=COUNTRIES[country];
  rememberPrefs(lang);   // so the unpaired screen can still speak their language
  document.documentElement.lang=lang;
  document.title='KinGuard — '+(cfg.senior_name||'')+U.possPhone;
  const tag=document.getElementById('tag'); if(tag) tag.textContent=U.tagline;
  const foot=document.getElementById('foot'); if(foot) foot.textContent=U.footSenior;
  if(cfg.big_text)      document.body.classList.add('big-text');
  if(cfg.high_contrast) document.body.classList.add('high-contrast');
  if(cfg.simple_mode)   document.body.classList.add('simple-mode');
  render();
}

function buzz(){ if(cfg.vibrate && navigator.vibrate) navigator.vibrate([300,150,300]); }

function render(announce){
  const s=document.getElementById('stage');
  if(view==='home') s.innerHTML=homeHTML();
  else if(view==='panic') s.innerHTML=verdictHTML('panic',true);
  else s.innerHTML=verdictHTML(view,false);
  s.classList.remove('fade');void s.offsetWidth;s.classList.add('fade');
  // Only buzz/speak on the first show of a verdict, not on the re-render that
  // follows the network result, otherwise it would announce twice per tap.
  if(view!=='home' && announce){ buzz(); if(cfg.auto_speak) speak(view); }
}

function homeHTML(){
  let opts='';
  C.grid.forEach(k=>{const r=R[k];
     opts+=`<button class="opt" onclick="tap('${k}')" aria-label="${r.label}">
      <span class="ic" aria-hidden="true">${r.icon}</span>
      <span class="lbl">${r.label}<small>${r.sub}</small></span></button>`;});
  return `<button class="panic" onclick="tap('panic')" aria-label="${U.panicAria}">
      <span class="ic" aria-hidden="true">🆘</span>
      <span class="txt"><span class="t1">${U.panicT1}</span><span class="t2">${U.panicT2}</span></span></button>
    <div class="divider">${U.orChoose}</div>
    <div class="lead">${U.whatHappening}</div>
    <div class="grid">${opts}</div>`;
}

async function tap(id){
  view=id; sendState='sending'; render(true);
  await sendAlert();
}

// The verdict is already on screen; this just reports whether the family was
// actually reached, and lets the senior retry if the alert didn't get through.
async function sendAlert(){
  try{
    const res=await fetch(api('/api/alert'),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({rule:view})});
    sendState=(res&&res.ok)?'ok':'failed';
  }catch(e){ sendState='failed'; }
  render(false);
}
async function resend(){ sendState='sending'; render(false); await sendAlert(); }

function verdictHTML(id,isPanic){
  const r=R[id];
  const famPhone = cfg.family_phone || '0000';
  const fam = esc(cfg.family_name);
  // What we honestly tell the senior about the family alert, based on whether
  // the POST actually went through. Never claim "sent" while it's failing.
  let notify, retry='';
  if(sendState==='sending'){
    notify=fmt(U.notifySending,{fam});
  } else if(sendState==='failed'){
    notify='<span style="color:#C0392B;font-weight:800">⚠️ '+esc(U.notifyFailed)+'</span>';
    retry='<button class="listen" style="background:#C0392B;color:#fff" onclick="resend()">'+esc(U.resend)+'</button>';
  } else {
    notify=fmt(U.notifyOk,{fam});
  }
  if(isPanic){
    return `<div class="verdict safe" role="alert"><span class="vic" aria-hidden="true">🛡️</span>
        <span><div class="vt">${U.safeTitle}</div>
        <div class="vw">${notify}</div></span></div>
      <div class="steps">
        <div class="step call"><span class="sic" aria-hidden="true">📞</span><span class="stx">${fmt(U.callFam,{fam})}</span></div>
        <div class="step"><span class="sic" aria-hidden="true">📵</span><span class="stx">${U.hangup}</span></div>
        <div class="step"><span class="sic" aria-hidden="true">🚫</span><span class="stx">${U.noMoney}</span></div>
      </div>
      <a class="callbtn" href="tel:${esc(famPhone)}"><span aria-hidden="true">📞</span><span>${fmt(U.callFam,{fam})}</span></a>
      ${retry}
      <button class="listen" id="listenBtn" onclick="speak('${id}')">${U.listen}</button>
      <button class="back" onclick="goHome()">${U.back}</button>`;
  }
    return `<div class="verdict" role="alert"><span class="vic" aria-hidden="true">🛑</span>
      <span><div class="vt">${U.fraudTitle}</div><div class="vw">${r.why}</div></span></div>
    <div class="steps">
      <div class="step"><span class="sic" aria-hidden="true">📵</span><span class="stx">${U.hangup}</span></div>
      <div class="step"><span class="sic" aria-hidden="true">🚫</span><span class="stx">${U.noMoney}</span></div>
      <div class="step alert"><span class="sic" aria-hidden="true">👨‍👩‍👦</span><span class="stx">${notify}</span></div>
    </div>
    ${retry}
    <button class="listen" id="listenBtn" onclick="speak('${id}')">${U.listen}</button>
    <a class="callbtn sec" href="tel:${C.report.tel}"><span aria-hidden="true">☎️</span><span>${fmt(U.helpDial,{label:C.report.label})}</span></a>
    <button class="back" onclick="goHome()">${U.back}</button>`;
}
// Stop any speech on the way out. Without this the explanation kept playing
// after the elder had left the screen, with nothing on screen to stop it -
// the Back button is not disabled while speaking, because
// trapping a frightened person on a screen for the 10-15 seconds it takes to
// read out is worse than the leak it would prevent.
function goHome(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  view='home';
  render();
}

function speak(id){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  let text;
  if(id==='panic') text=fmt(U.speakPanic,{fam:cfg.family_name});
  else text=U.fraudTitle+' '+R[id].why+' '+U.scamTail;
 const u=new SpeechSynthesisUtterance(text);u.lang=C.tts[langOf(cfg)]||C.tts.en||'en-US';u.rate=0.9;
   const btn=document.getElementById('listenBtn');
  u.onstart=()=>{if(btn){btn.classList.add('speaking');btn.textContent=U.speaking;}};
  u.onend=()=>{if(btn){btn.classList.remove('speaking');btn.textContent=U.listen;}};
  speechSynthesis.speak(u);
}

init();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
</body>
</html>
